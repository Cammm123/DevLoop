name: DevLoop
options:
  bundleIdPrefix: com.cameronkani
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CLZCN5NC8V
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  DevLoop:
    type: application
    platform: iOS
    sources:
      - path: DevLoop
        excludes:
          - Resources
      - path: Shared
    resources:
      - path: DevLoop/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DevLoop
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronkani.devloop
        INFOPLIST_FILE: DevLoop/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DevLoop/Resources/DevLoop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DevLoopWidgets
        embed: true
  DevLoopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Resources
      - path: Shared
    resources:
      - path: Widgets/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: DevLoopWidgets
        PRODUCT_MODULE_NAME: DevLoopWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronkani.devloop.widgets
        INFOPLIST_FILE: Widgets/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Resources/DevLoopWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
  DevLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_NAME: DevLoopTests
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronkani.devloop.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DevLoop
schemes:
  DevLoop:
    build:
      targets:
        DevLoop: all
        DevLoopWidgets: all
        DevLoopTests: [test]
    test:
      targets:
        - DevLoopTests
